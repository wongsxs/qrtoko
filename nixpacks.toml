[phases.setup]
nixPkgs = [
  'php83',
  'php83Extensions.pdo',
  'php83Extensions.pdo_sqlite',
  'php83Extensions.sqlite3',
  'php83Extensions.gd',
  'php83Extensions.mbstring',
  'php83Extensions.curl',
  'php83Extensions.zip',
  'php83Extensions.bcmath',
  'nodejs_20'
]

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader',
  'npm ci'
]

[phases.build]
cmds = [
  'npm run build'
]

[start]
cmd = 'touch database/database.sqlite && php artisan storage:link && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
